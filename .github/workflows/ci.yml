name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, test and clean migrations
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Avila.slnx

      - name: Build
        run: dotnet build Avila.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Avila.slnx --configuration Release --no-build --logger "console;verbosity=minimal"

  security:
    name: Security scans and SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Avila.slnx

      - name: Dependency vulnerability audit
        shell: pwsh
        run: ./scripts/ci/check-vulnerabilities.ps1 -Solution Avila.slnx

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Install CycloneDX
        run: dotnet tool install --global CycloneDX

      - name: Generate SBOM
        run: |
          mkdir -p artifacts/sbom
          dotnet CycloneDX Avila.slnx -o artifacts/sbom -F Json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: avila-sbom
          path: artifacts/sbom
          if-no-files-found: error
